worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Resolucao dinamica usando o servidor DNS dnsmasq interno
    resolver 172.28.0.2 valid=10s ipv6=off;

    # Servidor HTTP (porta 80) - Mantido ativo para demonstracao de trafego inseguro no Wireshark
    server {
        listen 80;
        server_name api.vinheria.local gateway.vinheria.local localhost;

        location = /health {
            default_type application/json;
            return 200 '{"status":"UP","gateway":"vinheria-nginx","protocol":"http"}';
        }

        location /auth/ {
            set $production_upstream "http://production.vinheria.local:8081";
            proxy_pass $production_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/batches {
            set $production_upstream "http://production.vinheria.local:8081";
            proxy_pass $production_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/tracking {
            set $tracking_upstream "http://tracking.vinheria.local:8082";
            proxy_pass $tracking_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /publish/ {
            alias /var/publish/vinheria/current/;
            index index.html;
            autoindex on;
        }
    }

    # Servidor HTTPS (porta 443) - Canal criptografado com TLS 1.2 / TLS 1.3
    server {
        listen 443 ssl;
        server_name api.vinheria.local gateway.vinheria.local localhost;

        ssl_certificate     /etc/nginx/certs/vinheria.crt;
        ssl_certificate_key /etc/nginx/certs/vinheria.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location = /health {
            default_type application/json;
            return 200 '{"status":"UP","gateway":"vinheria-nginx","protocol":"https"}';
        }

        location /auth/ {
            set $production_upstream "http://production.vinheria.local:8081";
            proxy_pass $production_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/batches {
            set $production_upstream "http://production.vinheria.local:8081";
            proxy_pass $production_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/tracking {
            set $tracking_upstream "http://tracking.vinheria.local:8082";
            proxy_pass $tracking_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /publish/ {
            alias /var/publish/vinheria/current/;
            index index.html;
            autoindex on;
        }
    }
}
