# Vinheria Agnello - DNS & DHCP Server (Fase 7)
interface=eth0
bind-interfaces
no-resolv
server=8.8.8.8
server=1.1.1.1

domain-needed
bogus-priv
expand-hosts
domain=vinheria.local
local=/vinheria.local/

# Registro DNS interno dos microsservicos e infraestrutura
host-record=dns.vinheria.local,172.28.0.2
host-record=production.vinheria.local,172.28.0.10
host-record=tracking.vinheria.local,172.28.0.20
host-record=gateway.vinheria.local,172.28.0.30
host-record=api.vinheria.local,172.28.0.30
host-record=jenkins.vinheria.local,172.28.0.40
filter-AAAA

# Pool DHCP na sub-rede da vinheria
dhcp-range=172.28.0.100,172.28.0.150,255.255.255.0,12h
dhcp-option=option:router,172.28.0.1
dhcp-option=option:dns-server,172.28.0.2
dhcp-option=option:domain-name,vinheria.local
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
dhcp-authoritative

# Logs para auditoria e evidencias
log-queries
log-dhcp
log-facility=-
